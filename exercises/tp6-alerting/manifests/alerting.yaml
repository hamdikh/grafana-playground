---
# TP6: local webhook receiver (no Teams tenant required for missions 1-8),
# the metrics-feeder CronJob that keeps PostgreSQL fed so alert rules have
# something to evaluate, and MailHog (TP Alerting Advanced extension) so the
# email contact point has somewhere to deliver to without a real SMTP account.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-echo
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-echo
  template:
    metadata:
      labels:
        app: webhook-echo
    spec:
      containers:
        - name: webhook-echo
          image: mendhak/http-https-echo:33
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_IGNORE_PATH
              value: "/health"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-echo
  namespace: lab
spec:
  selector:
    app: webhook-echo
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-feeder-sql
  namespace: lab
data:
  feed.sql: |
    INSERT INTO metrics (ts, host, env, cpu, mem)
    SELECT
      now(),
      h.host,
      h.env,
      round((30 + random() * 60)::numeric, 2),
      round((40 + random() * 50)::numeric, 2)
    FROM (VALUES
      ('web01', 'prod'),
      ('web02', 'prod'),
      ('db01',  'prod'),
      ('web03', 'staging')
    ) AS h(host, env);
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: metrics-feeder
  namespace: lab
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: feeder
              image: postgres:16-alpine
              command:
                - psql
                - postgresql://grafana:grafanapass@postgres.lab.svc.cluster.local:5432/metricsdb
                - -f
                - /sql/feed.sql
              volumeMounts:
                - name: sql
                  mountPath: /sql
          volumes:
            - name: sql
              configMap:
                name: metrics-feeder-sql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: lab
  labels:
    app: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: lab
  labels:
    app: mailhog
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
