---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: lab
type: Opaque
stringData:
  POSTGRES_DB: metricsdb
  POSTGRES_USER: grafana
  POSTGRES_PASSWORD: grafanapass
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: lab
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS metrics (
      id   BIGSERIAL PRIMARY KEY,
      ts   TIMESTAMPTZ NOT NULL,
      host TEXT NOT NULL,
      env  TEXT NOT NULL,
      cpu  NUMERIC(5,2) NOT NULL,
      mem  NUMERIC(5,2) NOT NULL
    );

    CREATE INDEX IF NOT EXISTS idx_metrics_ts ON metrics (ts);
    CREATE INDEX IF NOT EXISTS idx_metrics_host ON metrics (host);

    INSERT INTO metrics (ts, host, env, cpu, mem)
    SELECT
      now() - (n || ' minutes')::interval,
      h.host,
      h.env,
      round((30 + random() * 60)::numeric, 2),
      round((40 + random() * 50)::numeric, 2)
    FROM generate_series(0, 2879) AS n
    CROSS JOIN (VALUES
      ('web01', 'prod'),
      ('web02', 'prod'),
      ('db01',  'prod'),
      ('web03', 'staging')
    ) AS h(host, env);

    CREATE TABLE IF NOT EXISTS incidents (
      id        BIGSERIAL PRIMARY KEY,
      opened_at TIMESTAMPTZ NOT NULL,
      host      TEXT NOT NULL,
      severity  TEXT NOT NULL,
      title     TEXT NOT NULL
    );

    INSERT INTO incidents (opened_at, host, severity, title) VALUES
      (now() - interval '6 hours',  'web01', 'warning',  'Latence HTTP elevee'),
      (now() - interval '4 hours',  'db01',  'critical', 'Saturation disque'),
      (now() - interval '2 hours',  'web02', 'info',     'Redemarrage planifie'),
      (now() - interval '30 minutes','db01', 'warning',  'Slow query detectee');
  02-grafana-db.sql: |
    CREATE USER grafana_app WITH PASSWORD 'grafanaapp';
    CREATE DATABASE grafana OWNER grafana_app;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "grafana", "-d", "metricsdb"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
